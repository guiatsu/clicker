name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NeoAutoClicker-windows-x64
          path: target/x86_64-pc-windows-msvc/release/NeoAutoClicker.exe
          if-no-files-found: error
          retention-days: 30
